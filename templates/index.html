<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT Voice</title>

    <style>
        body {
            margin: 0;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 90%;
            max-width: 450px;
            background: #15151c;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,.5);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #5865F2;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            opacity: .9;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎙️ MT Voice</h1>

    <p>
        نظام الصوت الخاص بـ MT RP
    </p>

    <button id="connect">
        🎤 تشغيل المايك
    </button>

    <div id="status">
        غير متصل
    </div>

</div>

<script>

const button = document.getElementById("connect");
const status = document.getElementById("status");

button.onclick = async () => {

    try {

        status.innerText = "جاري الاتصال...";

        /*
         * نطلب صلاحية المايك
         */
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        stream.getTracks().forEach(track => {
            track.stop();
        });

        /*
         * لاحقاً هنا نحصل على LiveKit Token
         */
        const response = await fetch("/voice/token?user_id=test");

        if (!response.ok) {
            throw new Error("Token request failed");
        }

        const data = await response.json();

        console.log("LiveKit:", data);

        status.innerText = "🎙️ المايك جاهز";

        button.innerText = "🟢 متصل";

    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ تعذر تشغيل المايك";

    }

};

</script>

</body>
</html>
